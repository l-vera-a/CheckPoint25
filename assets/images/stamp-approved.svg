<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="stampInk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stampRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Stamp outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4f8065" stroke-width="7" opacity="0.82" filter="url(#stampRough)"/>

  <!-- Stamp inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#4f8065" stroke-width="2.5" opacity="0.75" filter="url(#stampRough)"/>

  <!-- Outer ring text: ПУНКТ ПРОПУСКА 25 -->
  <defs>
    <path id="outerRingTextPath" d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/>
  </defs>
  <text font-family="monospace" font-size="11" fill="#4f8065" opacity="0.85" letter-spacing="5" filter="url(#stampRough)">
    <textPath href="#outerRingTextPath" startOffset="4%">ПУНКТ ПРОПУСКА 25 ✦ ПУНКТ ПРОПУСКА 25 ✦</textPath>
  </text>

  <!-- Center decoration: geometric star -->
  <polygon points="100,44 106,76 138,76 113,95 122,127 100,110 78,127 87,95 62,76 94,76"
           fill="#4f8065" opacity="0.72" filter="url(#stampRough)"/>

  <!-- Center star inner highlight -->
  <polygon points="100,60 104,78 122,78 108,89 113,108 100,97 87,108 92,89 78,78 96,78"
           fill="none" stroke="#4f8065" stroke-width="1" opacity="0.4"/>

  <!-- Main center text: РАЗРЕШЕНО -->
  <text x="100" y="154" font-family="serif" font-size="17" fill="#4f8065" text-anchor="middle"
        font-weight="bold" letter-spacing="2" opacity="0.88" filter="url(#stampRough)">РАЗРЕШЕНО</text>

  <!-- Underline under main text -->
  <line x1="30" y1="160" x2="170" y2="160" stroke="#4f8065" stroke-width="2" opacity="0.6" filter="url(#stampRough)"/>

  <!-- Inner decorative dashes -->
  <line x1="52" y1="174" x2="148" y2="174" stroke="#4f8065" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>

  <!-- Small text at bottom inside ring -->
  <text x="100" y="168" font-family="monospace" font-size="7" fill="#4f8065" text-anchor="middle"
        letter-spacing="2" opacity="0.65">APPROVED</text>

  <!-- Tick marks between rings -->
  <line x1="100" y1="10" x2="100" y2="18" stroke="#4f8065" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="182" x2="100" y2="190" stroke="#4f8065" stroke-width="2" opacity="0.6"/>
  <line x1="10" y1="100" x2="18" y2="100" stroke="#4f8065" stroke-width="2" opacity="0.6"/>
  <line x1="182" y1="100" x2="190" y2="100" stroke="#4f8065" stroke-width="2" opacity="0.6"/>
</svg>
