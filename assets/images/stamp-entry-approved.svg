<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <style>
      /* animation handled externally by CSS on the img element */
    </style>
    <filter id="entryStampRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" result="noise" seed="14"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="entryStampRough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="noise" seed="8"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bgNum" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7a568" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c7a568" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <!-- Background numeral "25" (large, lighter shade) -->
    <text x="150" y="180" font-family="serif" font-size="150" fill="#c7a568" text-anchor="middle"
          font-weight="bold" opacity="0.12" letter-spacing="4">25</text>

    <!-- Outer ring (thick) -->
    <circle cx="150" cy="150" r="135" fill="none" stroke="#c7a568" stroke-width="9" opacity="0.82" filter="url(#entryStampRough)"/>

    <!-- Second ring -->
    <circle cx="150" cy="150" r="122" fill="none" stroke="#c7a568" stroke-width="2.5" opacity="0.72" filter="url(#entryStampRough)"/>

    <!-- Inner ring -->
    <circle cx="150" cy="150" r="110" fill="none" stroke="#c7a568" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.55" filter="url(#entryStampRough)"/>

    <!-- Outer ring text top: ПУНКТ ПРОПУСКА №25 -->
    <defs>
      <path id="entryOuterRingTop" d="M150,150 m-116,0 a116,116 0 1,1 232,0 a116,116 0 1,1 -232,0"/>
    </defs>
    <text font-family="monospace" font-size="13" fill="#c7a568" opacity="0.85" letter-spacing="6" filter="url(#entryStampRough)">
      <textPath href="#entryOuterRingTop" startOffset="4%">ПУНКТ ПРОПУСКА №25 ✦ CHECKPOINT 25 ✦</textPath>
    </text>

    <!-- Star decorations (6-pointed) -->
    <g filter="url(#entryStampRough)" opacity="0.7">
      <!-- Star top-left -->
      <polygon points="60,90 64,102 76,102 67,110 70,122 60,115 50,122 53,110 44,102 56,102"
               fill="#c7a568" opacity="0.6" transform="scale(0.6) translate(50, 20)"/>
      <!-- Star top-right -->
      <polygon points="240,90 244,102 256,102 247,110 250,122 240,115 230,122 233,110 224,102 236,102"
               fill="#c7a568" opacity="0.6" transform="scale(0.6) translate(-50, 20)"/>
    </g>

    <!-- Large inner star (main decorative element) -->
    <g transform="translate(150, 150)" filter="url(#entryStampRough)" opacity="0.75">
      <!-- 8-point star -->
      <polygon points="0,-52 8,-20 38,-38 20,-8 52,0 20,8 38,38 8,20 0,52 -8,20 -38,38 -20,8 -52,0 -20,-8 -38,-38 -8,-20"
               fill="#c7a568" opacity="0.55"/>
      <!-- Inner 4-point -->
      <polygon points="0,-30 10,-10 30,0 10,10 0,30 -10,10 -30,0 -10,-10"
               fill="#c7a568" opacity="0.4"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="8" fill="#c7a568" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#c7a568" opacity="0.8"/>
    </g>

    <!-- Main text: ВЪЕЗД РАЗРЕШЁН (two lines) -->
    <text x="150" y="218" font-family="serif" font-size="24" fill="#c7a568" text-anchor="middle"
          font-weight="bold" letter-spacing="2" opacity="0.92" filter="url(#entryStampRough2)">ВЪЕЗД</text>
    <text x="150" y="246" font-family="serif" font-size="24" fill="#c7a568" text-anchor="middle"
          font-weight="bold" letter-spacing="1" opacity="0.92" filter="url(#entryStampRough2)">РАЗРЕШЁН</text>

    <!-- Decorative lines around main text -->
    <line x1="40" y1="255" x2="260" y2="255" stroke="#c7a568" stroke-width="2" opacity="0.6" filter="url(#entryStampRough)"/>
    <line x1="50" y1="260" x2="250" y2="260" stroke="#c7a568" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" filter="url(#entryStampRough)"/>
    <line x1="50" y1="200" x2="250" y2="200" stroke="#c7a568" stroke-width="1.5" opacity="0.5" filter="url(#entryStampRough)"/>

    <!-- Sub label -->
    <text x="150" y="272" font-family="monospace" font-size="9" fill="#c7a568" text-anchor="middle"
          letter-spacing="3" opacity="0.65">ENTRY APPROVED</text>

    <!-- Axis tick marks -->
    <line x1="150" y1="14" x2="150" y2="26" stroke="#c7a568" stroke-width="3" opacity="0.65" filter="url(#entryStampRough)"/>
    <line x1="150" y1="274" x2="150" y2="286" stroke="#c7a568" stroke-width="3" opacity="0.65" filter="url(#entryStampRough)"/>
    <line x1="14" y1="150" x2="26" y2="150" stroke="#c7a568" stroke-width="3" opacity="0.65" filter="url(#entryStampRough)"/>
    <line x1="274" y1="150" x2="286" y2="150" stroke="#c7a568" stroke-width="3" opacity="0.65" filter="url(#entryStampRough)"/>

    <!-- 45° tick marks -->
    <line x1="44" y1="44" x2="53" y2="53" stroke="#c7a568" stroke-width="2" opacity="0.5" filter="url(#entryStampRough)"/>
    <line x1="247" y1="44" x2="256" y2="53" stroke="#c7a568" stroke-width="2" opacity="0.5" filter="url(#entryStampRough)"/>
    <line x1="44" y1="256" x2="53" y2="247" stroke="#c7a568" stroke-width="2" opacity="0.5" filter="url(#entryStampRough)"/>
    <line x1="247" y1="256" x2="256" y2="247" stroke="#c7a568" stroke-width="2" opacity="0.5" filter="url(#entryStampRough)"/>
  </g>
</svg>
