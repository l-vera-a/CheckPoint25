<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes blinkSlow {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.3; }
      }
      @keyframes flicker {
        0%, 95%, 100% { opacity: 1; }
        96% { opacity: 0.7; }
        97% { opacity: 1; }
        98% { opacity: 0.5; }
      }
      .blink-fast { animation: blink 1.2s ease-in-out infinite; }
      .blink-slow { animation: blinkSlow 2.8s ease-in-out infinite; }
      .blink-offset { animation: blink 1.8s ease-in-out infinite 0.6s; }
      .flicker { animation: flicker 6s ease-in-out infinite; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060c12"/>
      <stop offset="100%" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c25"/>
      <stop offset="100%" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#0d2030"/>
    </linearGradient>
    <linearGradient id="signGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3040"/>
      <stop offset="100%" stop-color="#0f2030"/>
    </linearGradient>
    <linearGradient id="boothGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172632"/>
      <stop offset="100%" stop-color="#0f1d28"/>
    </linearGradient>
    <radialGradient id="screenAmbient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a4060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceilingLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1a3d55" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boothScreen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a6080"/>
      <stop offset="100%" stop-color="#0d2535"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Ceiling ambient light -->
  <ellipse cx="400" cy="0" rx="400" ry="200" fill="url(#ceilingLight)"/>

  <!-- Corridor floor perspective -->
  <polygon points="0,500 800,500 650,280 150,280" fill="url(#floorGrad)"/>

  <!-- Floor grid lines -->
  <line x1="400" y1="500" x2="400" y2="280" stroke="#172632" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#172632" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="370" x2="750" y2="370" stroke="#172632" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="330" x2="680" y2="330" stroke="#172632" stroke-width="1" opacity="0.35"/>
  <line x1="200" y1="500" x2="300" y2="280" stroke="#172632" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="500" x2="500" y2="280" stroke="#172632" stroke-width="1" opacity="0.3"/>

  <!-- Left wall -->
  <rect x="0" y="0" width="155" height="500" fill="#0d1a24"/>
  <rect x="143" y="0" width="12" height="500" fill="#172632"/>

  <!-- Right wall -->
  <rect x="645" y="0" width="155" height="500" fill="#0d1a24"/>
  <rect x="645" y="0" width="12" height="500" fill="#172632"/>

  <!-- Left wall panel 1 -->
  <rect x="10" y="50" width="125" height="85" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <rect x="15" y="55" width="115" height="75" rx="1" fill="#0d1a24"/>
  <line x1="22" y1="70" x2="125" y2="70" stroke="#344550" stroke-width="1"/>
  <line x1="22" y1="82" x2="105" y2="82" stroke="#344550" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="94" x2="118" y2="94" stroke="#344550" stroke-width="1"/>
  <line x1="22" y1="106" x2="95" y2="106" stroke="#344550" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="118" x2="120" y2="118" stroke="#344550" stroke-width="1"/>
  <text x="22" y="63" font-family="monospace" font-size="6" fill="#93a2aa" opacity="0.7">SECTOR LOG // NODE-24</text>

  <!-- Left wall panel 2 - status bars -->
  <rect x="10" y="155" width="125" height="65" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <rect x="15" y="160" width="115" height="55" rx="1" fill="url(#screenGlow)"/>
  <rect x="22" y="168" width="65" height="6" rx="1" fill="#4f8065" opacity="0.8"/>
  <rect x="22" y="180" width="88" height="6" rx="1" fill="#4f8065" opacity="0.6"/>
  <rect x="22" y="192" width="42" height="6" rx="1" fill="#a88042" opacity="0.7"/>
  <rect x="22" y="204" width="78" height="6" rx="1" fill="#4f8065" opacity="0.5"/>
  <text x="22" y="163" font-family="monospace" font-size="5.5" fill="#4f8065" opacity="0.9">BIOMETRIC SCAN</text>

  <!-- Left wall panel 3 -->
  <rect x="10" y="240" width="125" height="38" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <text x="72" y="263" font-family="monospace" font-size="7" fill="#93a2aa" text-anchor="middle">SYS.STATUS: ACTIVE</text>

  <!-- Indicator dot left -->
  <circle cx="130" cy="253" r="4" fill="#4f8065" class="blink-fast"/>

  <!-- Right wall panel 1 -->
  <rect x="665" y="50" width="125" height="85" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <rect x="670" y="55" width="115" height="75" rx="1" fill="#0d1a24"/>
  <line x1="675" y1="70" x2="778" y2="70" stroke="#344550" stroke-width="1"/>
  <line x1="675" y1="82" x2="758" y2="82" stroke="#344550" stroke-width="1" opacity="0.6"/>
  <line x1="675" y1="94" x2="772" y2="94" stroke="#344550" stroke-width="1"/>
  <line x1="675" y1="106" x2="748" y2="106" stroke="#344550" stroke-width="1" opacity="0.7"/>
  <line x1="675" y1="118" x2="768" y2="118" stroke="#344550" stroke-width="1"/>
  <text x="675" y="63" font-family="monospace" font-size="6" fill="#93a2aa" opacity="0.7">SECTOR LOG // NODE-25</text>

  <!-- Right wall panel 2 -->
  <rect x="665" y="155" width="125" height="65" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <rect x="670" y="160" width="115" height="55" rx="1" fill="url(#screenGlow)"/>
  <rect x="678" y="168" width="75" height="6" rx="1" fill="#4f8065" opacity="0.8"/>
  <rect x="678" y="180" width="52" height="6" rx="1" fill="#4f8065" opacity="0.6"/>
  <rect x="678" y="192" width="98" height="6" rx="1" fill="#904d48" opacity="0.7"/>
  <rect x="678" y="204" width="60" height="6" rx="1" fill="#4f8065" opacity="0.5"/>
  <text x="678" y="163" font-family="monospace" font-size="5.5" fill="#4f8065" opacity="0.9">PASSAGE CONTROL</text>

  <!-- Right wall panel 3 -->
  <rect x="665" y="240" width="125" height="38" rx="2" fill="#111c25" stroke="#344550" stroke-width="1"/>
  <text x="728" y="263" font-family="monospace" font-size="7" fill="#93a2aa" text-anchor="middle">QUEUE: 01 PERSON</text>
  <circle cx="670" cy="253" r="4" fill="#a88042" class="blink-offset"/>

  <!-- Ceiling structure -->
  <rect x="0" y="0" width="800" height="28" fill="#0d1a24"/>
  <rect x="0" y="26" width="800" height="4" fill="#172632"/>

  <!-- Ceiling light strip -->
  <rect x="155" y="2" width="490" height="18" fill="#111c25" opacity="0.9"/>
  <rect x="155" y="18" width="490" height="2" fill="#344550"/>
  <rect x="220" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="268" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="316" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="364" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="412" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="460" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="508" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>
  <rect x="556" y="5" width="28" height="9" rx="1" fill="#1a3d55" opacity="0.9"/>

  <!-- Control booth (center) -->
  <rect x="288" y="198" width="224" height="168" rx="4" fill="url(#boothGrad)" stroke="#344550" stroke-width="2"/>
  <rect x="293" y="203" width="214" height="158" rx="3" fill="#111c25"/>

  <!-- Booth window -->
  <rect x="302" y="212" width="196" height="106" rx="2" fill="url(#boothScreen)" filter="url(#softGlow)"/>
  <rect x="302" y="212" width="196" height="106" rx="2" fill="none" stroke="#344550" stroke-width="1.5"/>

  <!-- Screen content -->
  <rect x="308" y="218" width="184" height="94" rx="1" fill="url(#screenGlow)" opacity="0.8" class="flicker"/>
  <line x1="316" y1="232" x2="486" y2="232" stroke="#4f8065" stroke-width="1" opacity="0.5"/>
  <line x1="316" y1="242" x2="468" y2="242" stroke="#4f8065" stroke-width="1" opacity="0.35"/>
  <line x1="316" y1="252" x2="480" y2="252" stroke="#344550" stroke-width="1" opacity="0.7"/>
  <text x="400" y="267" font-family="monospace" font-size="8.5" fill="#4f8065" text-anchor="middle" opacity="0.95">SECTOR BOUNDARY CONTROL</text>
  <text x="400" y="280" font-family="monospace" font-size="7.5" fill="#93a2aa" text-anchor="middle" opacity="0.7">TERMINAL NODE: 25</text>
  <text x="400" y="293" font-family="monospace" font-size="6.5" fill="#93a2aa" text-anchor="middle" opacity="0.5">SYS.READY // AWAITING INPUT</text>
  <text x="400" y="306" font-family="monospace" font-size="6" fill="#344550" text-anchor="middle" opacity="0.8">— — — — — — — — — — — —</text>

  <!-- Booth indicators -->
  <circle cx="310" cy="328" r="5" fill="#904d48" class="blink-slow"/>
  <circle cx="326" cy="328" r="5" fill="#a88042" class="blink-offset"/>
  <circle cx="342" cy="328" r="5" fill="#4f8065" class="blink-fast"/>

  <!-- Booth counter ledge -->
  <rect x="288" y="338" width="224" height="18" rx="2" fill="#172632" stroke="#344550" stroke-width="1"/>
  <rect x="288" y="352" width="224" height="14" rx="0" fill="#111c25" stroke="#344550" stroke-width="1"/>

  <!-- Main overhead sign "24 → 25" -->
  <rect x="175" y="42" width="450" height="108" rx="4" fill="url(#signGrad)" stroke="#344550" stroke-width="2"/>
  <rect x="180" y="47" width="440" height="98" rx="3" fill="#0d1e2c" stroke="#1e3545" stroke-width="1"/>
  <rect x="188" y="55" width="424" height="82" rx="2" fill="none" stroke="#1e3545" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Sign label top -->
  <text x="400" y="62" font-family="monospace" font-size="7" fill="#93a2aa" text-anchor="middle" letter-spacing="4" opacity="0.8">ПУНКТ ПРОПУСКА / CHECKPOINT</text>

  <!-- Main sign number -->
  <text x="400" y="122" font-family="monospace" font-size="52" fill="#e5ebee" text-anchor="middle" font-weight="bold" filter="url(#glow)" letter-spacing="6">24 → 25</text>

  <!-- Sign corner dots -->
  <circle cx="190" cy="60" r="4" fill="#4f8065" class="blink-slow"/>
  <circle cx="610" cy="60" r="4" fill="#4f8065" class="blink-slow"/>
  <circle cx="190" cy="138" r="4" fill="#344550"/>
  <circle cx="610" cy="138" r="4" fill="#344550"/>

  <!-- Gate / turnstile structure -->
  <!-- Gate frame posts -->
  <rect x="268" y="368" width="18" height="132" rx="2" fill="#172632" stroke="#344550" stroke-width="1.5"/>
  <rect x="514" y="368" width="18" height="132" rx="2" fill="#172632" stroke="#344550" stroke-width="1.5"/>

  <!-- Gate cross bar -->
  <rect x="284" y="365" width="232" height="10" rx="2" fill="#172632" stroke="#344550" stroke-width="1"/>

  <!-- Gate arm (closed horizontal barrier) -->
  <rect x="284" y="418" width="232" height="10" rx="2" fill="#344550"/>
  <!-- Danger stripes on barrier -->
  <rect x="284" y="418" width="28" height="10" fill="#904d48" opacity="0.75"/>
  <rect x="342" y="418" width="28" height="10" fill="#904d48" opacity="0.75"/>
  <rect x="400" y="418" width="28" height="10" fill="#904d48" opacity="0.75"/>
  <rect x="458" y="418" width="28" height="10" fill="#904d48" opacity="0.75"/>
  <rect x="284" y="420" width="232" height="3" fill="#4a5f6a" opacity="0.4"/>

  <!-- Gate hinge/pivot indicator -->
  <circle cx="284" cy="423" r="7" fill="#172632" stroke="#344550" stroke-width="1.5"/>
  <circle cx="284" cy="423" r="3" fill="#344550"/>

  <!-- Gate foot base -->
  <rect x="260" y="494" width="280" height="8" rx="1" fill="#172632" stroke="#344550" stroke-width="1"/>

  <!-- Gate indicator lights -->
  <circle cx="277" cy="392" r="6" fill="#904d48" filter="url(#glow)" class="blink-slow"/>
  <circle cx="523" cy="392" r="6" fill="#904d48" filter="url(#glow)" class="blink-slow"/>

  <!-- CLOSED label -->
  <text x="400" y="452" font-family="monospace" font-size="8" fill="#904d48" text-anchor="middle" letter-spacing="4" opacity="0.8">ЗАКРЫТО / CLOSED</text>

  <!-- Passenger silhouette (side/back view) -->
  <g transform="translate(92, 285)">
    <!-- Ground shadow -->
    <ellipse cx="50" cy="148" rx="22" ry="5" fill="#060c12" opacity="0.9"/>
    <!-- Legs -->
    <rect x="36" y="104" width="12" height="44" rx="2" fill="#1a2e3d"/>
    <rect x="52" y="104" width="12" height="44" rx="2" fill="#172839"/>
    <!-- Coat/torso -->
    <path d="M28,56 L22,62 L22,106 L78,106 L78,62 L72,56 Z" fill="#1e3040"/>
    <!-- Lapels -->
    <path d="M40,56 L34,68 L40,80" fill="none" stroke="#172632" stroke-width="2"/>
    <path d="M60,56 L66,68 L60,80" fill="none" stroke="#172632" stroke-width="2"/>
    <!-- Arms -->
    <rect x="14" y="60" width="12" height="38" rx="3" fill="#1a2e3d"/>
    <rect x="74" y="60" width="12" height="38" rx="3" fill="#1a2e3d"/>
    <!-- Briefcase in right hand -->
    <rect x="74" y="90" width="18" height="14" rx="1" fill="#152230" stroke="#344550" stroke-width="1"/>
    <rect x="79" y="87" width="8" height="5" rx="1" fill="none" stroke="#344550" stroke-width="1"/>
    <!-- Neck -->
    <rect x="42" y="44" width="16" height="15" rx="2" fill="#1a2e3d"/>
    <!-- Head -->
    <ellipse cx="50" cy="34" rx="16" ry="18" fill="#1e3040"/>
    <!-- Cap -->
    <rect x="33" y="20" width="34" height="10" rx="2" fill="#172632"/>
    <rect x="27" y="26" width="8" height="6" rx="1" fill="#172632"/>
  </g>

  <!-- Floor ambient glow -->
  <ellipse cx="400" cy="488" rx="260" ry="18" fill="#1a3d55" opacity="0.06"/>
  <!-- Screen ambient light on scene -->
  <ellipse cx="400" cy="300" rx="200" ry="100" fill="url(#screenAmbient)"/>
</svg>
