<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="declPaperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede1c9"/>
      <stop offset="50%" stop-color="#e6dac3"/>
      <stop offset="100%" stop-color="#ddd0b5"/>
    </linearGradient>
    <linearGradient id="declHeaderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3040"/>
      <stop offset="100%" stop-color="#152535"/>
    </linearGradient>
    <pattern id="guilloche" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q5,0 10,10 Q15,20 20,10" fill="none" stroke="#c8bc9e" stroke-width="0.5" opacity="0.5"/>
      <path d="M0,10 Q5,20 10,10 Q15,0 20,10" fill="none" stroke="#b8a882" stroke-width="0.4" opacity="0.35"/>
    </pattern>
    <pattern id="securityLines" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0,15 Q7.5,0 15,15 Q22.5,30 30,15" fill="none" stroke="#c0b490" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <filter id="docDropShadow">
      <feDropShadow dx="4" dy="4" stdDeviation="10" flood-color="#060c12" flood-opacity="0.45"/>
    </filter>
    <filter id="embossed">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Document shadow -->
  <rect x="16" y="16" width="568" height="768" rx="4" fill="#060c12" opacity="0.35" filter="url(#docDropShadow)"/>

  <!-- Document body -->
  <rect x="10" y="10" width="580" height="780" rx="3" fill="url(#declPaperGrad)"/>

  <!-- Security background pattern -->
  <rect x="10" y="10" width="580" height="780" rx="3" fill="url(#guilloche)" opacity="0.7"/>
  <rect x="10" y="10" width="580" height="780" rx="3" fill="url(#securityLines)" opacity="0.5"/>

  <!-- Outer border (double) -->
  <rect x="14" y="14" width="572" height="772" rx="2" fill="none" stroke="#8a7c60" stroke-width="2.5"/>
  <rect x="20" y="20" width="560" height="760" rx="2" fill="none" stroke="#a09070" stroke-width="1" opacity="0.7"/>
  <rect x="24" y="24" width="552" height="752" rx="1" fill="none" stroke="#8a7c60" stroke-width="0.6" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- DIAGONAL WATERMARK -->
  <text x="300" y="420" font-family="serif" font-size="68" fill="#b8a882" text-anchor="middle" opacity="0.055"
        transform="rotate(-35, 300, 420)" letter-spacing="3" font-weight="bold">ОФИЦИАЛЬНЫЙ</text>
  <text x="300" y="500" font-family="serif" font-size="55" fill="#b8a882" text-anchor="middle" opacity="0.055"
        transform="rotate(-35, 300, 500)" letter-spacing="2" font-weight="bold">ДОКУМЕНТ</text>

  <!-- Second watermark pass at different angle -->
  <text x="300" y="300" font-family="serif" font-size="40" fill="#a09070" text-anchor="middle" opacity="0.04"
        transform="rotate(-35, 300, 300)" letter-spacing="8">OFFICIAL DOCUMENT</text>

  <!-- HEADER AREA (dark) -->
  <rect x="28" y="28" width="544" height="100" rx="2" fill="url(#declHeaderGrad)"/>
  <rect x="32" y="32" width="536" height="92" rx="1" fill="none" stroke="#344550" stroke-width="0.8" opacity="0.5"/>

  <!-- Header emblem/seal placeholder (circle) -->
  <circle cx="76" cy="78" r="32" fill="none" stroke="#93a2aa" stroke-width="1.5" opacity="0.7"/>
  <circle cx="76" cy="78" r="24" fill="none" stroke="#93a2aa" stroke-width="1" opacity="0.4"/>
  <circle cx="76" cy="78" r="15" fill="none" stroke="#93a2aa" stroke-width="0.8" opacity="0.3"/>
  <!-- Emblem rays -->
  <line x1="76" y1="46" x2="76" y2="52" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="76" y1="104" x2="76" y2="110" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="44" y1="78" x2="50" y2="78" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="102" y1="78" x2="108" y2="78" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="53" y1="55" x2="57" y2="59" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="95" y1="97" x2="99" y2="101" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="99" y1="55" x2="95" y2="59" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <line x1="57" y1="97" x2="53" y2="101" stroke="#93a2aa" stroke-width="1.5" opacity="0.5"/>
  <!-- Emblem center star -->
  <polygon points="76,62 79,72 90,72 81,79 84,90 76,83 68,90 71,79 62,72 73,72" fill="#93a2aa" opacity="0.4"/>

  <!-- Header text -->
  <text x="300" y="52" font-family="monospace" font-size="8" fill="#93a2aa" text-anchor="middle" letter-spacing="4" opacity="0.8">FEDERAL TRANSIT AUTHORITY // ТАМОЖЕННАЯ СЛУЖБА</text>
  <text x="300" y="72" font-family="serif" font-size="16" fill="#e5ebee" text-anchor="middle" letter-spacing="4" font-weight="bold">ПУНКТ ПРОПУСКА №25</text>
  <text x="300" y="90" font-family="monospace" font-size="10" fill="#e5ebee" text-anchor="middle" letter-spacing="3">ДЕКЛАРАЦИЯ</text>
  <text x="300" y="106" font-family="monospace" font-size="7.5" fill="#93a2aa" text-anchor="middle" letter-spacing="2" opacity="0.7">DECLARATION FORM // FORM PP-25-D</text>

  <!-- Header bottom line -->
  <line x1="28" y1="128" x2="572" y2="128" stroke="#8a7c60" stroke-width="2"/>
  <line x1="28" y1="131" x2="572" y2="131" stroke="#a09070" stroke-width="0.6" opacity="0.5"/>

  <!-- SECTION 1: Personal Information -->
  <text x="40" y="155" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">РАЗДЕЛ I / SECTION I — ЛИЧНЫЕ СВЕДЕНИЯ</text>
  <line x1="36" y1="160" x2="564" y2="160" stroke="#a09070" stroke-width="1"/>

  <!-- Form lines section 1 -->
  <text x="40" y="180" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">1. ФАМИЛИЯ / FULL NAME</text>
  <line x1="40" y1="196" x2="400" y2="196" stroke="#8a7c60" stroke-width="0.8"/>
  <text x="40" y="192" font-family="serif" font-size="13" fill="#282621">Nikita</text>

  <text x="420" y="180" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">2. ДАТА</text>
  <line x1="420" y1="196" x2="564" y2="196" stroke="#8a7c60" stroke-width="0.8"/>
  <text x="420" y="192" font-family="monospace" font-size="9" fill="#282621">25.05.2026</text>

  <text x="40" y="216" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">3. СЕКТОР ИСХОДА / SECTOR OF ORIGIN</text>
  <line x1="40" y1="232" x2="564" y2="232" stroke="#8a7c60" stroke-width="0.8"/>
  <text x="40" y="228" font-family="serif" font-size="13" fill="#282621">СЕКТОР 24</text>

  <text x="40" y="252" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">4. СЕКТОР НАЗНАЧЕНИЯ / SECTOR OF DESTINATION</text>
  <line x1="40" y1="268" x2="564" y2="268" stroke="#8a7c60" stroke-width="0.8"/>
  <text x="40" y="264" font-family="serif" font-size="13" fill="#282621">СЕКТОР 25</text>

  <!-- SECTION 2 divider -->
  <line x1="36" y1="286" x2="564" y2="286" stroke="#8a7c60" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="40" y="302" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">РАЗДЕЛ II / SECTION II — ДЕКЛАРИРУЕМОЕ</text>
  <line x1="36" y1="308" x2="564" y2="308" stroke="#a09070" stroke-width="1"/>

  <!-- Form lines section 2 -->
  <text x="40" y="326" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">5. ПЕРЕВОЗИМЫЕ ЦЕННОСТИ / ITEMS OF VALUE</text>
  <line x1="40" y1="342" x2="564" y2="342" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="360" x2="564" y2="360" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="378" x2="564" y2="378" stroke="#8a7c60" stroke-width="0.8"/>

  <text x="40" y="398" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">6. ОПЫТ / ACCUMULATED EXPERIENCE</text>
  <line x1="40" y1="414" x2="564" y2="414" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="432" x2="564" y2="432" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="450" x2="564" y2="450" stroke="#8a7c60" stroke-width="0.8"/>

  <!-- SECTION 3 divider -->
  <line x1="36" y1="468" x2="564" y2="468" stroke="#8a7c60" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="40" y="484" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">РАЗДЕЛ III / SECTION III — ОБЯЗАТЕЛЬСТВА</text>
  <line x1="36" y1="490" x2="564" y2="490" stroke="#a09070" stroke-width="1"/>

  <text x="40" y="508" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">7. НАМЕРЕНИЯ В СЕКТОРЕ 25 / INTENTIONS IN SECTOR 25</text>
  <line x1="40" y1="524" x2="564" y2="524" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="542" x2="564" y2="542" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="560" x2="564" y2="560" stroke="#8a7c60" stroke-width="0.8"/>
  <line x1="40" y1="578" x2="564" y2="578" stroke="#8a7c60" stroke-width="0.8"/>

  <!-- Signature area -->
  <line x1="36" y1="608" x2="564" y2="608" stroke="#8a7c60" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Signature box left -->
  <rect x="40" y="622" width="200" height="70" rx="1" fill="none" stroke="#8a7c60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="140" y="682" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle">ПОДПИСЬ / SIGNATURE</text>
  <line x1="60" y1="664" x2="220" y2="664" stroke="#a09070" stroke-width="0.8" opacity="0.5"/>

  <!-- Stamp box right -->
  <rect x="360" y="622" width="200" height="70" rx="1" fill="none" stroke="#8a7c60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="460" y="682" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle">ШТАМП / STAMP</text>
  <!-- Stamp placeholder circle -->
  <circle cx="460" cy="645" r="22" fill="none" stroke="#a09070" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Footer section -->
  <line x1="36" y1="710" x2="564" y2="710" stroke="#8a7c60" stroke-width="1.5"/>
  <line x1="36" y1="713" x2="564" y2="713" stroke="#a09070" stroke-width="0.5" opacity="0.4"/>

  <text x="300" y="730" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle" letter-spacing="2">ФОРМА ДЕЙСТВИТЕЛЬНА ТОЛЬКО С ОФИЦИАЛЬНОЙ ПЕЧАТЬЮ</text>
  <text x="300" y="745" font-family="monospace" font-size="6" fill="#a09070" text-anchor="middle" letter-spacing="1.5" opacity="0.7">THIS FORM IS VALID ONLY WITH AN OFFICIAL SEAL</text>
  <text x="300" y="762" font-family="monospace" font-size="6" fill="#8a7c60" text-anchor="middle" opacity="0.6">DOC. NO: PP-25-D-001 // REV. 1.0 // ПУНКТ ПРОПУСКА №25</text>

  <!-- Corner decorations (ornate) -->
  <!-- Top-left corner -->
  <g transform="translate(14, 14)">
    <path d="M0,0 L40,0 L0,40 Z" fill="#a09070" opacity="0.15"/>
    <path d="M6,6 L6,32" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M6,6 L32,6" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M10,10 L10,26" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
    <path d="M10,10 L26,10" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
  </g>
  <!-- Top-right corner -->
  <g transform="translate(586, 14)">
    <path d="M0,0 L-40,0 L0,40 Z" fill="#a09070" opacity="0.15"/>
    <path d="M-6,6 L-6,32" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-6,6 L-32,6" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-10,10 L-10,26" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
    <path d="M-10,10 L-26,10" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
  </g>
  <!-- Bottom-left corner -->
  <g transform="translate(14, 786)">
    <path d="M0,0 L40,0 L0,-40 Z" fill="#a09070" opacity="0.15"/>
    <path d="M6,-6 L6,-32" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M6,-6 L32,-6" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M10,-10 L10,-26" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
    <path d="M10,-10 L26,-10" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
  </g>
  <!-- Bottom-right corner -->
  <g transform="translate(586, 786)">
    <path d="M0,0 L-40,0 L0,-40 Z" fill="#a09070" opacity="0.15"/>
    <path d="M-6,-6 L-6,-32" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-6,-6 L-32,-6" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-10,-10 L-10,-26" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
    <path d="M-10,-10 L-26,-10" stroke="#a09070" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- Side ornamental lines (left) -->
  <line x1="36" y1="155" x2="36" y2="608" stroke="#a09070" stroke-width="0.6" opacity="0.4" stroke-dasharray="2,4"/>
  <!-- Side ornamental lines (right) -->
  <line x1="564" y1="155" x2="564" y2="608" stroke="#a09070" stroke-width="0.6" opacity="0.4" stroke-dasharray="2,4"/>
</svg>
