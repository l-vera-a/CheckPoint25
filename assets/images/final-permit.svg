<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="permitPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede1c9"/>
      <stop offset="45%" stop-color="#e6dac3"/>
      <stop offset="100%" stop-color="#ddd0b5"/>
    </linearGradient>
    <linearGradient id="permitHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152535"/>
      <stop offset="100%" stop-color="#0f1d28"/>
    </linearGradient>
    <linearGradient id="permitFooter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e3c"/>
      <stop offset="100%" stop-color="#0f1d28"/>
    </linearGradient>
    <pattern id="guillochePermit" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0,12 Q6,0 12,12 Q18,24 24,12" fill="none" stroke="#c8bc9e" stroke-width="0.5" opacity="0.45"/>
      <path d="M0,12 Q6,24 12,12 Q18,0 24,12" fill="none" stroke="#b8a882" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <pattern id="fineGrillPermit" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="none" stroke="#c8bc9e" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <radialGradient id="sealAreaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7a568" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e6dac3" stop-opacity="0"/>
    </radialGradient>
    <filter id="permitShadow">
      <feDropShadow dx="5" dy="5" stdDeviation="12" flood-color="#060c12" flood-opacity="0.4"/>
    </filter>
    <filter id="goldenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Document shadow -->
  <rect x="18" y="18" width="664" height="864" rx="5" fill="#060c12" opacity="0.3" filter="url(#permitShadow)"/>

  <!-- Document outer edge (dark binding strip) -->
  <rect x="10" y="10" width="680" height="880" rx="4" fill="#1e3040"/>
  <rect x="10" y="10" width="30" height="880" rx="4" fill="#172632" opacity="0.8"/>

  <!-- Document body -->
  <rect x="38" y="10" width="652" height="880" rx="3" fill="url(#permitPaper)"/>

  <!-- Security pattern layers -->
  <rect x="38" y="10" width="652" height="880" rx="3" fill="url(#guillochePermit)" opacity="0.8"/>
  <rect x="38" y="10" width="652" height="880" rx="3" fill="url(#fineGrillPermit)" opacity="0.6"/>

  <!-- Watermark diagonal text (very faint) -->
  <text x="364" y="500" font-family="serif" font-size="72" fill="#b8a882" text-anchor="middle" opacity="0.04"
        transform="rotate(-30, 364, 500)" letter-spacing="4" font-weight="bold">РАЗРЕШЕНО</text>
  <text x="364" y="600" font-family="serif" font-size="50" fill="#a09070" text-anchor="middle" opacity="0.035"
        transform="rotate(-30, 364, 600)" letter-spacing="3">PERMITTED</text>

  <!-- Outer decorative border (double + ornate) -->
  <rect x="46" y="18" width="636" height="864" rx="2" fill="none" stroke="#8a7c60" stroke-width="2.5"/>
  <rect x="52" y="24" width="624" height="852" rx="2" fill="none" stroke="#b8a882" stroke-width="1" opacity="0.6"/>
  <rect x="58" y="30" width="612" height="840" rx="1" fill="none" stroke="#8a7c60" stroke-width="0.6" stroke-dasharray="5,3" opacity="0.4"/>

  <!-- HEADER (dark) -->
  <rect x="46" y="18" width="636" height="110" rx="2" fill="url(#permitHeader)"/>
  <rect x="52" y="24" width="624" height="98" rx="1" fill="none" stroke="#344550" stroke-width="0.8" opacity="0.4"/>

  <!-- Header emblem left -->
  <circle cx="100" cy="73" r="36" fill="none" stroke="#93a2aa" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="73" r="28" fill="none" stroke="#93a2aa" stroke-width="1" opacity="0.35"/>
  <!-- Emblem star -->
  <polygon points="100,53 104,66 118,66 107,75 111,88 100,79 89,88 93,75 82,66 96,66" fill="#93a2aa" opacity="0.4"/>
  <circle cx="100" cy="73" r="6" fill="#344550" opacity="0.5"/>

  <!-- Header emblem right (mirror) -->
  <circle cx="596" cy="73" r="36" fill="none" stroke="#93a2aa" stroke-width="2" opacity="0.6"/>
  <circle cx="596" cy="73" r="28" fill="none" stroke="#93a2aa" stroke-width="1" opacity="0.35"/>
  <polygon points="596,53 600,66 614,66 603,75 607,88 596,79 585,88 589,75 578,66 592,66" fill="#93a2aa" opacity="0.4"/>
  <circle cx="596" cy="73" r="6" fill="#344550" opacity="0.5"/>

  <!-- Header text block -->
  <text x="348" y="44" font-family="monospace" font-size="7.5" fill="#93a2aa" text-anchor="middle" letter-spacing="5" opacity="0.85">FEDERAL TRANSIT AUTHORITY — ТАМОЖЕННАЯ СЛУЖБА</text>
  <text x="348" y="64" font-family="serif" font-size="14" fill="#e5ebee" text-anchor="middle" letter-spacing="5" font-weight="bold">ПОГРАНИЧНО-ТАМОЖЕННАЯ СЛУЖБА</text>
  <text x="348" y="82" font-family="monospace" font-size="10" fill="#e5ebee" text-anchor="middle" letter-spacing="4">ПУНКТ ПРОПУСКА №25</text>
  <text x="348" y="100" font-family="monospace" font-size="8" fill="#93a2aa" text-anchor="middle" letter-spacing="3" opacity="0.75">BORDER AND CUSTOMS SERVICE // CHECKPOINT 25</text>
  <text x="348" y="116" font-family="monospace" font-size="7" fill="#93a2aa" text-anchor="middle" letter-spacing="2" opacity="0.55">FINAL TRANSIT PERMIT // ОКОНЧАТЕЛЬНОЕ РАЗРЕШЕНИЕ</text>

  <!-- Header bottom divider -->
  <line x1="46" y1="128" x2="682" y2="128" stroke="#8a7c60" stroke-width="2.5"/>
  <line x1="46" y1="132" x2="682" y2="132" stroke="#b8a882" stroke-width="0.8" opacity="0.5"/>

  <!-- Document number prominent display -->
  <rect x="68" y="148" width="400" height="48" rx="2" fill="#ddd0b5" stroke="#8a7c60" stroke-width="1.5"/>
  <text x="88" y="164" font-family="monospace" font-size="7" fill="#5a4a30" letter-spacing="1.5">№ РАЗРЕШЕНИЯ / PERMIT NUMBER</text>
  <text x="88" y="186" font-family="monospace" font-size="16" fill="#282621" letter-spacing="2" font-weight="bold">РЕШ-25-НИКИТА-001</text>

  <!-- Status badge -->
  <rect x="490" y="148" width="168" height="48" rx="2" fill="#1a3025" stroke="#4f8065" stroke-width="1.5"/>
  <text x="574" y="168" font-family="monospace" font-size="7" fill="#4f8065" text-anchor="middle" letter-spacing="1">СТАТУС / STATUS</text>
  <text x="574" y="186" font-family="monospace" font-size="12" fill="#4f8065" text-anchor="middle" font-weight="bold" letter-spacing="1">PENDING</text>

  <!-- Section divider -->
  <line x1="68" y1="214" x2="620" y2="214" stroke="#8a7c60" stroke-width="1.5"/>
  <line x1="68" y1="217" x2="620" y2="217" stroke="#a09070" stroke-width="0.5" opacity="0.4"/>

  <!-- SECTION I: Subject data -->
  <text x="68" y="235" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">I. ДАННЫЕ СУБЪЕКТА / SUBJECT DATA</text>

  <!-- Data field rows -->
  <text x="68" y="258" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">ПОЛНОЕ ИМЯ / FULL NAME</text>
  <line x1="68" y1="262" x2="500" y2="262" stroke="#a09070" stroke-width="0.8"/>
  <text x="68" y="258" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1" opacity="0">x</text>
  <text x="200" y="258" font-family="serif" font-size="14" fill="#282621" font-weight="bold">NIKITA</text>

  <text x="68" y="286" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">СЕКТОР ИСХОДА</text>
  <line x1="68" y1="290" x2="350" y2="290" stroke="#a09070" stroke-width="0.8"/>
  <text x="220" y="286" font-family="monospace" font-size="11" fill="#282621">SECTOR 24</text>

  <text x="370" y="286" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">СЕКТОР НАЗНАЧЕНИЯ</text>
  <line x1="370" y1="290" x2="620" y2="290" stroke="#a09070" stroke-width="0.8"/>
  <text x="520" y="286" font-family="monospace" font-size="11" fill="#282621">SECTOR 25</text>

  <text x="68" y="314" font-family="monospace" font-size="7" fill="#8a7c60" letter-spacing="1">ДАТА ПЕРЕСЕЧЕНИЯ / DATE OF CROSSING</text>
  <line x1="68" y1="318" x2="620" y2="318" stroke="#a09070" stroke-width="0.8"/>
  <text x="300" y="314" font-family="monospace" font-size="11" fill="#282621">25 МАЯ 2026 / 25 MAY 2026</text>

  <!-- Section divider -->
  <line x1="68" y1="338" x2="620" y2="338" stroke="#8a7c60" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- SECTION II: Terms -->
  <text x="68" y="358" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">II. УСЛОВИЯ РАЗРЕШЕНИЯ / PERMIT CONDITIONS</text>

  <line x1="68" y1="380" x2="620" y2="380" stroke="#a09070" stroke-width="0.8"/>
  <line x1="68" y1="400" x2="620" y2="400" stroke="#a09070" stroke-width="0.8"/>
  <line x1="68" y1="420" x2="620" y2="420" stroke="#a09070" stroke-width="0.8"/>
  <line x1="68" y1="440" x2="620" y2="440" stroke="#a09070" stroke-width="0.8"/>
  <line x1="68" y1="460" x2="620" y2="460" stroke="#a09070" stroke-width="0.8"/>
  <line x1="68" y1="480" x2="620" y2="480" stroke="#a09070" stroke-width="0.8"/>

  <!-- Section divider -->
  <line x1="68" y1="500" x2="620" y2="500" stroke="#8a7c60" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- SECTION III: Seal area -->
  <text x="68" y="520" font-family="monospace" font-size="8" fill="#5a4a30" letter-spacing="2" font-weight="bold">III. ОФИЦИАЛЬНОЕ ПОДТВЕРЖДЕНИЕ / OFFICIAL CONFIRMATION</text>

  <!-- Left side: signature block -->
  <rect x="68" y="540" width="230" height="110" rx="2" fill="none" stroke="#8a7c60" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="183" y="625" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle">ПОДПИСЬ УПОЛНОМОЧЕННОГО</text>
  <text x="183" y="638" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle">AUTHORIZED SIGNATURE</text>
  <line x1="90" y1="608" x2="276" y2="608" stroke="#a09070" stroke-width="0.8" opacity="0.6"/>

  <!-- RIGHT SIDE: Large circular seal position (dashed circle outline) -->
  <g transform="translate(468, 595)">
    <!-- Seal area glow -->
    <circle cx="0" cy="0" r="115" fill="url(#sealAreaGlow)"/>
    <!-- Outer dashed circle (large) -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#a09070" stroke-width="2" stroke-dasharray="8,5" opacity="0.6"/>
    <!-- Second ring -->
    <circle cx="0" cy="0" r="96" fill="none" stroke="#8a7c60" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a09070" stroke-width="1" stroke-dasharray="3,4" opacity="0.35"/>
    <!-- Center cross marks -->
    <line x1="-108" y1="0" x2="108" y2="0" stroke="#a09070" stroke-width="0.6" opacity="0.25"/>
    <line x1="0" y1="-108" x2="0" y2="108" stroke="#a09070" stroke-width="0.6" opacity="0.25"/>
    <!-- Tick marks around outer circle -->
    <line x1="108" y1="-8" x2="108" y2="8" stroke="#8a7c60" stroke-width="1.5" opacity="0.4"/>
    <line x1="-108" y1="-8" x2="-108" y2="8" stroke="#8a7c60" stroke-width="1.5" opacity="0.4"/>
    <line x1="-8" y1="-108" x2="8" y2="-108" stroke="#8a7c60" stroke-width="1.5" opacity="0.4"/>
    <line x1="-8" y1="108" x2="8" y2="108" stroke="#8a7c60" stroke-width="1.5" opacity="0.4"/>
    <!-- Label inside seal area -->
    <text x="0" y="-12" font-family="monospace" font-size="8" fill="#a09070" text-anchor="middle" opacity="0.6" letter-spacing="1">МЕСТО</text>
    <text x="0" y="4" font-family="monospace" font-size="8" fill="#a09070" text-anchor="middle" opacity="0.6" letter-spacing="1">ОФИЦИАЛЬНОЙ</text>
    <text x="0" y="20" font-family="monospace" font-size="8" fill="#a09070" text-anchor="middle" opacity="0.6" letter-spacing="1">ПЕЧАТИ</text>
    <text x="0" y="38" font-family="monospace" font-size="6.5" fill="#8a7c60" text-anchor="middle" opacity="0.5">OFFICIAL SEAL</text>
  </g>

  <!-- Section divider after seal -->
  <line x1="68" y1="726" x2="620" y2="726" stroke="#8a7c60" stroke-width="1.5"/>
  <line x1="68" y1="729" x2="620" y2="729" stroke="#b8a882" stroke-width="0.5" opacity="0.4"/>

  <!-- FOOTER: dark band -->
  <rect x="46" y="750" width="636" height="132" rx="0" fill="url(#permitFooter)"/>
  <rect x="46" y="878" width="636" height="10" rx="2" fill="#0f1d28"/>

  <!-- Footer content -->
  <text x="348" y="774" font-family="monospace" font-size="7" fill="#e5ebee" text-anchor="middle" letter-spacing="3" opacity="0.9">ПОГРАНИЧНО-ТАМОЖЕННАЯ СЛУЖБА — ПУНКТ ПРОПУСКА №25</text>
  <line x1="68" y1="780" x2="620" y2="780" stroke="#344550" stroke-width="0.8" opacity="0.5"/>

  <text x="348" y="800" font-family="monospace" font-size="6.5" fill="#93a2aa" text-anchor="middle" letter-spacing="2" opacity="0.75">ДОКУМЕНТ ЯВЛЯЕТСЯ ОФИЦИАЛЬНЫМ РАЗРЕШЕНИЕМ НА ПЕРЕХОД В СЕКТОР 25</text>
  <text x="348" y="816" font-family="monospace" font-size="6.5" fill="#93a2aa" text-anchor="middle" letter-spacing="1.5" opacity="0.6">THIS DOCUMENT CONSTITUTES OFFICIAL AUTHORIZATION TO ENTER SECTOR 25</text>

  <line x1="68" y1="832" x2="620" y2="832" stroke="#344550" stroke-width="0.8" opacity="0.4"/>

  <!-- Footer serial / barcode area -->
  <text x="68" y="852" font-family="monospace" font-size="6" fill="#93a2aa" opacity="0.5">SER: РЕШ-25-НИКИТА-001</text>
  <text x="348" y="852" font-family="monospace" font-size="6" fill="#93a2aa" text-anchor="middle" opacity="0.5">AUTH: FTA-PP25-2026</text>
  <text x="620" y="852" font-family="monospace" font-size="6" fill="#93a2aa" text-anchor="end" opacity="0.5">VER: 1.0.0</text>

  <!-- Footer bottom fine line -->
  <line x1="68" y1="860" x2="620" y2="860" stroke="#344550" stroke-width="0.6" opacity="0.3"/>

  <text x="348" y="875" font-family="monospace" font-size="5.5" fill="#344550" text-anchor="middle" opacity="0.7" letter-spacing="3">ПОДДЕЛКА ДОКУМЕНТА ЯВЛЯЕТСЯ НАРУШЕНИЕМ ЗАКОНОДАТЕЛЬСТВА</text>

  <!-- Binding strip (left side) -->
  <rect x="10" y="10" width="30" height="880" rx="4" fill="#172632"/>
  <!-- Binding holes -->
  <circle cx="25" cy="100" r="8" fill="#0b1117" stroke="#344550" stroke-width="1"/>
  <circle cx="25" cy="440" r="8" fill="#0b1117" stroke="#344550" stroke-width="1"/>
  <circle cx="25" cy="780" r="8" fill="#0b1117" stroke="#344550" stroke-width="1"/>

  <!-- Corner ornaments -->
  <!-- Top-left inner -->
  <g transform="translate(58, 30)">
    <path d="M0,0 L36,0 L0,36 Z" fill="#a09070" opacity="0.12"/>
    <path d="M4,4 L4,28" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M4,4 L28,4" stroke="#8a7c60" stroke-width="1.5"/>
  </g>
  <!-- Top-right inner -->
  <g transform="translate(630, 30)">
    <path d="M0,0 L-36,0 L0,36 Z" fill="#a09070" opacity="0.12"/>
    <path d="M-4,4 L-4,28" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-4,4 L-28,4" stroke="#8a7c60" stroke-width="1.5"/>
  </g>
  <!-- Bottom-left inner -->
  <g transform="translate(58, 878)">
    <path d="M0,0 L36,0 L0,-36 Z" fill="#a09070" opacity="0.12"/>
    <path d="M4,-4 L4,-28" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M4,-4 L28,-4" stroke="#8a7c60" stroke-width="1.5"/>
  </g>
  <!-- Bottom-right inner -->
  <g transform="translate(630, 878)">
    <path d="M0,0 L-36,0 L0,-36 Z" fill="#a09070" opacity="0.12"/>
    <path d="M-4,-4 L-4,-28" stroke="#8a7c60" stroke-width="1.5"/>
    <path d="M-4,-4 L-28,-4" stroke="#8a7c60" stroke-width="1.5"/>
  </g>
</svg>
